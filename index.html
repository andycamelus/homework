
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Workout Tracker</title>

<style>
:root {
  --bg:#0f1115;
  --panel:#171a21;
  --panel2:#1f2430;
  --text:#f5f7fb;
  --muted:#9aa4b2;
  --accent:#7dd3fc;
  --good:#86efac;
  --border:#2b3240;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap {
  max-width:1200px;
  margin:0 auto;
  padding:24px;
}

h1 { margin:0 0 6px; font-size:32px; }
.sub { color:var(--muted); margin-bottom:18px; }

.toolbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

button {
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

button:hover { border-color:var(--accent); }

.primary {
  background:var(--accent);
  color:#071018;
  border-color:transparent;
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  margin-bottom:22px;
}

.day {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  min-height:135px;
  cursor:pointer;
}

.day:hover { border-color:var(--accent); }
.day.active { outline:2px solid var(--accent); }
.day.done { border-color:var(--good); }

.dow { font-weight:800; margin-bottom:8px; }
.focus { font-size:14px; color:var(--accent); font-weight:700; }
.run { font-size:12px; color:var(--muted); margin-top:5px; }
.status { margin-top:14px; font-size:12px; color:var(--good); }

.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
}

.panel h2 { margin-top:0; }

.exercise {
  display:grid;
  grid-template-columns:2fr .8fr .8fr .8fr;
  gap:10px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.exercise:last-child { border-bottom:0; }

.prescription {
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

input, textarea {
  width:100%;
  background:#10141b;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:9px;
  padding:9px;
}

textarea {
  min-height:75px;
  resize:vertical;
}

.labels {
  display:grid;
  grid-template-columns:2fr .8fr .8fr .8fr;
  gap:10px;
  color:var(--muted);
  font-size:12px;
  padding-bottom:6px;
}

.runbox, .notes {
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--border);
}

.run-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.bottom-actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}

.history { margin-top:22px; }

.history-item {
  padding:10px 0;
  border-bottom:1px solid var(--border);
  color:var(--muted);
  font-size:14px;
}

/* Exercise names */

.exercise-name-btn {
  appearance:none;
  border:0;
  background:transparent;
  color:var(--text);
  padding:0;
  margin:0;
  font:inherit;
  font-weight:800;
  text-align:left;
  cursor:pointer;
  text-decoration:underline;
  text-decoration-style:dotted;
  text-underline-offset:4px;
}

.exercise-name-btn:hover { color:var(--accent); }

/* Exercise explanation popup */

.modal-backdrop {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999;
}

.modal-backdrop.open { display:flex; }

.exercise-modal {
  width:min(550px,100%);
  max-height:85vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.modal-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}

.modal-head h3 {
  margin:0;
  font-size:24px;
}

.close-modal {
  width:42px;
  height:42px;
  padding:0;
  border-radius:50%;
  font-size:24px;
  line-height:1;
  cursor:pointer;
  flex-shrink:0;
}

.cue-list {
  margin:10px 0 0;
  padding-left:22px;
  color:var(--muted);
}

.cue-list li { margin:9px 0; }

@media(max-width:900px) {
  .calendar { grid-template-columns:1fr 1fr; }
}

@media(max-width:650px) {
  .wrap { padding:14px; }
  .calendar { grid-template-columns:1fr; }

  .exercise,.labels {
    grid-template-columns:1.4fr .7fr .7fr;
  }

  .exercise input:nth-of-type(3),
  .labels span:last-child {
    display:none;
  }

  .run-grid { grid-template-columns:1fr; }
}
</style>
</head>

/* =========================
   DATE + STORAGE
========================= */

const state = {
weekOffset:0,
selectedDate:null
};

function isoDate(d) {
const x = new Date(d);
x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
return x.toISOString().slice(0,10);
}

function startOfWeek(d) {
const x = new Date(d);
x.setDate(x.getDate() - x.getDay());
x.setHours(0,0,0,0);
return x;
}

function getWeekStart() {
const start = startOfWeek(new Date());
start.setDate(start.getDate() + state.weekOffset * 7);
return start;
}

function getRotationWeek(date) {
const anchor = startOfWeek(new Date(2026,7,9));
const current = startOfWeek(date);
const diff = Math.floor((current-anchor)/(7*24*60*60*1000));
return ((diff % 4)+4)%4+1;
}

function getPlanForDate(date) {
return rotationPlan[getRotationWeek(date)][date.getDay()];
}

function workoutKey(date) {
return "workout_" + isoDate(date);
}

function loadEntry(date) {
try {
return JSON.parse(localStorage.getItem(workoutKey(date))) || {};
} catch {
return {};
}
}

function saveEntry(date,data) {
localStorage.setItem(workoutKey(date),JSON.stringify(data));
}


/* REMEMBER WHICH DAY USER WAS VIEWING */

function saveViewState() {
if(state.selectedDate) {
localStorage.setItem(
"workout_last_selected_date",
isoDate(state.selectedDate)
);
}
}

function restoreViewState() {

const saved =
localStorage.getItem("workout_last_selected_date");

if(!saved) {
state.selectedDate = new Date();
state.weekOffset = 0;
return;
}

const parts = saved.split("-").map(Number);

state.selectedDate =
new Date(parts[0],parts[1]-1,parts[2]);

const thisWeek = startOfWeek(new Date());
const selectedWeek = startOfWeek(state.selectedDate);

state.weekOffset =
Math.round(
(selectedWeek-thisWeek) /
(7*24*60*60*1000)
);

}


/* =========================
   CALENDAR
========================= */

function renderCalendar() {

const calendar =
document.getElementById("calendar");

calendar.innerHTML="";

const start = getWeekStart();

const names =
["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

for(let i=0;i<7;i++) {

const date = new Date(start);
date.setDate(start.getDate()+i);

const workout = getPlanForDate(date);
const entry = loadEntry(date);

const day =
document.createElement("div");

day.className="day";

if(
state.selectedDate &&
isoDate(state.selectedDate)===isoDate(date)
) {
day.classList.add("active");
}

if(entry.complete) {
day.classList.add("done");
}

day.innerHTML=`

<div class="dow">
${names[date.getDay()]} •
${date.getMonth()+1}/${date.getDate()}
</div>

<div class="focus">
Week ${getRotationWeek(date)} •
${workout.name}
</div>

<div class="run">
${workout.run}
</div>

${entry.complete ?
'<div class="status">✓ Complete</div>' :
''}

`;

day.onclick=()=>{

state.selectedDate=date;

saveViewState();

renderCalendar();
renderDay();

};

calendar.appendChild(day);

}

}

const list =
document.getElementById("exerciseList");

list.innerHTML="";

workout.exercises.forEach((exercise,index)=>{

const saved =
(entry.exercises || [])[index] || {};

const row =
document.createElement("div");

row.className="exercise";

row.innerHTML=`

<div>

<button
type="button"
class="exercise-name-btn"
data-guide="${exercise[0]}">
${exercise[0]}
</button>

<span class="prescription">
${exercise[1]}
</span>

</div>

<input
data-field="weight"
data-idx="${index}"
placeholder="lbs"
value="${saved.weight || ""}">

<input
data-field="reps"
data-idx="${index}"
placeholder="reps"
value="${saved.reps || ""}">

<input
data-field="sets"
data-idx="${index}"
placeholder="sets"
value="${saved.sets || ""}">

`;

list.appendChild(row);

});


/* RUN SECTION */

const runBox =
document.getElementById("runBox");

if(
workout.run==="No run" ||
date.getDay()===0
) {

runBox.innerHTML=`

<strong>Conditioning</strong>
<div class="sub">
${workout.run}
</div>

`;

} else {

runBox.innerHTML=`

<strong>Run / Conditioning</strong>

<div class="sub">
${workout.run}
</div>

<div class="run-grid">

<input
id="runDistance"
placeholder="Distance / route"
value="${entry.runDistance || ""}">

<input
id="runTime"
placeholder="Time"
value="${entry.runTime || ""}">

<input
id="runEffort"
placeholder="Effort 1–10"
value="${entry.runEffort || ""}">

</div>

`;

}

document.getElementById("notes").value =
entry.notes || "";

document.getElementById("completeBtn").textContent =
entry.complete ?
"Mark Incomplete" :
"Mark Complete";

renderHistory();

}


/* =========================
   SAVE WORKOUT
========================= */

function collectEntry() {

const inputs =
[...document.querySelectorAll("#exerciseList input")];

const exercises=[];

inputs.forEach(input=>{

const index =
Number(input.dataset.idx);

exercises[index] =
exercises[index] || {};

exercises[index][input.dataset.field] =
input.value;

});

const existing =
loadEntry(state.selectedDate);

return {

...existing,

exercises,

runDistance:
document.getElementById("runDistance")?.value || "",

runTime:
document.getElementById("runTime")?.value || "",

runEffort:
document.getElementById("runEffort")?.value || "",

notes:
document.getElementById("notes").value,

savedAt:
new Date().toISOString()

};

}


/* =========================
   HISTORY
========================= */

function renderHistory() {

const target =
document.getElementById("historyList");

const dayOfWeek =
state.selectedDate.getDay();

const rows=[];

for(let i=0;i<140;i++) {

const date=new Date();
date.setDate(date.getDate()-i);

if(date.getDay()!==dayOfWeek) continue;

const entry=loadEntry(date);

if(!entry.savedAt && !entry.complete) continue;

const workout=getPlanForDate(date);

const summary =
(entry.exercises || [])
.map((item,index)=>{

if(
!item ||
(!item.weight && !item.reps && !item.sets)
) return null;

return `${workout.exercises[index]?.[0] || "Exercise"}:
${item.weight || "-"} lb /
${item.reps || "-"} reps /
${item.sets || "-"} sets`;

})
.filter(Boolean)
.slice(0,2)
.join(" • ");

rows.push(`

<div class="history-item">

<strong>
${date.toLocaleDateString()}
• Week ${getRotationWeek(date)}
</strong>

${entry.complete ? " ✓" : ""}

<br>

${summary || "Workout saved"}

${entry.runTime ?
` • Run: ${entry.runTime}` :
""}

</div>

`);

if(rows.length>=5) break;

}

target.innerHTML =
rows.length ?
rows.join("") :
'<div class="history-item">No previous entries yet.</div>';

}


/* =========================
   EXERCISE GUIDE
========================= */

function openExerciseGuide(name) {

const guide =
exerciseGuides[name];

if(!guide) return;

document.getElementById(
"exerciseModalTitle"
).textContent=name;

document.getElementById(
"exerciseModalContent"
).innerHTML=`

<strong>How to do it</strong>

<ul class="cue-list">

${guide.cues
.map(cue=>`<li>${cue}</li>`)
.join("")}

</ul>

<div class="runbox">

<strong>Keep in mind:</strong>

<span class="prescription">
${guide.warning}
</span>

</div>

`;

document.getElementById(
"exerciseModalBackdrop"
).classList.add("open");

}

function closeExerciseGuide() {

document.getElementById(
"exerciseModalBackdrop"
).classList.remove("open");

}


/* CLICK HANDLING */

document.addEventListener("click",function(event){

const guideButton =
event.target.closest("[data-guide]");

if(guideButton) {

openExerciseGuide(
guideButton.dataset.guide
);

return;

}

if(
event.target.closest(
"#closeExerciseModal"
)
) {

closeExerciseGuide();

return;

}

if(
event.target.id ===
"exerciseModalBackdrop"
) {

closeExerciseGuide();

}

});

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape") {
closeExerciseGuide();
}

});


/* =========================
   BUTTONS
========================= */

document.getElementById("saveBtn").onclick=()=>{

saveEntry(
state.selectedDate,
collectEntry()
);

renderCalendar();
renderHistory();

};

document.getElementById("completeBtn").onclick=()=>{

const entry=collectEntry();

entry.complete =
!loadEntry(state.selectedDate).complete;

saveEntry(
state.selectedDate,
entry
);

renderCalendar();
renderDay();

};

document.getElementById("prevWeek").onclick=()=>{

state.weekOffset--;

state.selectedDate =
new Date(getWeekStart());

saveViewState();

renderCalendar();
renderDay();

};

document.getElementById("nextWeek").onclick=()=>{

state.weekOffset++;

state.selectedDate =
new Date(getWeekStart());

saveViewState();

renderCalendar();
renderDay();

};

document.getElementById("todayBtn").onclick=()=>{

state.weekOffset=0;
state.selectedDate=new Date();

saveViewState();

renderCalendar();
renderDay();

};


/* RESET */

document.getElementById("resetBtn").onclick=()=>{

if(
confirm(
"Delete all saved workout data from this browser?"
)
) {

Object.keys(localStorage)
.filter(key=>key.startsWith("workout_"))
.forEach(key=>localStorage.removeItem(key));

localStorage.removeItem(
"workout_last_selected_date"
);

state.weekOffset=0;
state.selectedDate=new Date();

saveViewState();

renderCalendar();
renderDay();

}

};


/* EXPORT */

document.getElementById("exportBtn").onclick=()=>{

const data={};

Object.keys(localStorage)

.filter(key=>key.startsWith("workout_"))

.sort()

.forEach(key=>{

data[key.replace("workout_","")] =
JSON.parse(
localStorage.getItem(key)
);

});

const blob =
new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"home-workout-history.json";

link.click();

URL.revokeObjectURL(link.href);

};


/* =========================
   START APP
========================= */

restoreViewState();

renderCalendar();

renderDay();

</script>

</body>
</html>
