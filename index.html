<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home Workout Tracker</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel2:#1f2430;
    --text:#f5f7fb;
    --muted:#9aa4b2;
    --accent:#7dd3fc;
    --good:#86efac;
    --border:#2b3240;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:1200px;margin:0 auto;padding:24px}
  h1{margin:0 0 6px;font-size:32px}
  .sub{color:var(--muted);margin-bottom:24px}
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px
  }
  button,.btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    padding:10px 14px;border-radius:10px;
    cursor:pointer;font-weight:700;
  }
  button:hover{border-color:var(--accent)}
  .primary{background:var(--accent);color:#071018;border-color:transparent}
  .calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .day{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    min-height:135px;
    cursor:pointer;
  }
  .day.active{outline:2px solid var(--accent)}
  .day.done{border-color:var(--good)}
  .dow{font-weight:800;margin-bottom:8px}
  .focus{font-size:14px;color:var(--accent);font-weight:700}
  .run{font-size:12px;color:var(--muted);margin-top:5px}
  .status{margin-top:14px;font-size:12px;color:var(--good)}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
  }
  .panel h2{margin-top:0}
  .exercise{
    display:grid;
    grid-template-columns:2fr .8fr .8fr .8fr;
    gap:10px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .exercise:last-child{border-bottom:0}
  .exercise strong{display:block}
  .prescription{color:var(--muted);font-size:13px}
  input,textarea{
    width:100%;
    background:#10141b;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px;
  }
  textarea{min-height:75px;resize:vertical}
  .labels{
    display:grid;
    grid-template-columns:2fr .8fr .8fr .8fr;
    gap:10px;
    color:var(--muted);
    font-size:12px;
    padding-bottom:6px;
  }
  .runbox,.notes{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--border);
  }
  .run-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .bottom-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .history{margin-top:22px}
  .history-item{
    padding:10px 0;border-bottom:1px solid var(--border);
    color:var(--muted);font-size:14px
  }
  @media(max-width:900px){
    .calendar{grid-template-columns:1fr 1fr}
  }
  @media(max-width:650px){
    .calendar{grid-template-columns:1fr}
    .exercise,.labels{grid-template-columns:1.4fr .7fr .7fr}
    .exercise input:nth-of-type(3), .labels span:last-child{display:none}
    .run-grid{grid-template-columns:1fr}
  }

  .exercise-name-btn{
    appearance:none;
    border:0;
    background:transparent;
    color:var(--text);
    padding:0;
    margin:0;
    font:inherit;
    font-weight:800;
    text-align:left;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-style:dotted;
    text-underline-offset:4px;
  }
  .exercise-name-btn:hover{color:var(--accent)}
  .exercise-name-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  .exercise-name-static{font-weight:800}
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
  }
  .modal-backdrop.open{display:flex}
  .exercise-modal{
    width:min(680px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:12px;
  }
  .modal-head h3{margin:0;font-size:24px}
  .close-modal{
    width:44px;height:44px;padding:0;border-radius:50%;
    font-size:22px;line-height:1;
  }
  .diagram-wrap{
    background:#10141b;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    margin:12px 0 16px;
  }
  .diagram-wrap svg{display:block;width:100%;height:auto}
  .cue-list{margin:8px 0 0;padding-left:20px;color:var(--muted)}
  .cue-list li{margin:7px 0}
  .diagram-label{font-size:14px;fill:#f5f7fb;font-weight:700}
  .diagram-muted{font-size:12px;fill:#9aa4b2}
  .figure-line{stroke:#f5f7fb;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .db-line{stroke:#7dd3fc;stroke-width:6;stroke-linecap:round}
  .arrow-line{stroke:#86efac;stroke-width:4;stroke-linecap:round;fill:none}

</style>
</head>

<div class="wrap">
  <h1>Home Workout Tracker</h1>
  <div class="sub">15–20 minute strength + speed plan • Titan bench + PowerBlock dumbbells</div>
  <div class="sub">Four-week rotation: strength stays trackable, accessory lifts and conditioning change week to week.</div>

  <div class="toolbar">
    <button id="prevWeek">← Previous Week</button>
    <button id="todayBtn" class="primary">This Week</button>
    <button id="nextWeek">Next Week →</button>
    <button id="exportBtn">Export Data</button>
    <button id="resetBtn">Reset All Data</button>
  </div>

  <div id="calendar" class="calendar"></div>

  <div class="panel">
    <h2 id="dayTitle"></h2>
    <div id="daySubtitle" class="sub"></div>

    <div class="labels">
      <span>Exercise</span><span>Weight</span><span>Reps</span><span>Sets</span>
    </div>
    <div id="exerciseList"></div>

    <div id="runBox" class="runbox"></div>

    <div class="notes">
      <strong>Notes</strong>
      <textarea id="notes" placeholder="How did you feel? Anything to change next time?"></textarea>
    </div>

    <div class="bottom-actions">
      <button id="saveBtn" class="primary">Save Workout</button>
      <button id="completeBtn">Mark Complete</button>
    </div>

    <div class="history">
      <h3>Recent entries for this workout</h3>
      <div id="historyList"></div>
    </div>
  </div>
</div>

function getRotationWeek(date){
  // Anchor the 4-week cycle to the week containing Aug 9, 2026.
  const anchor = startOfWeek(new Date(2026,7,9));
  const current = startOfWeek(new Date(date));
  const diffWeeks = Math.floor((current - anchor) / (7*24*60*60*1000));
  return ((diffWeeks % 4) + 4) % 4 + 1;
}

function getPlanForDate(date){
  const week = getRotationWeek(date);
  return rotationPlan[week][date.getDay()];
}

const state = {
  weekOffset:0,
  selectedDate:null
};

function isoDate(d){
  const x = new Date(d);
  x.setMinutes(x.getMinutes()-x.getTimezoneOffset());
  return x.toISOString().slice(0,10);
}
function startOfWeek(d){
  const x = new Date(d);
  const day = x.getDay();
  x.setDate(x.getDate()-day);
  x.setHours(0,0,0,0);
  return x;
}
function getWeekStart(){
  const now = new Date();
  const s = startOfWeek(now);
  s.setDate(s.getDate() + state.weekOffset*7);
  return s;
}
function keyFor(date){return "workout_"+isoDate(date)}
function loadEntry(date){
  try{return JSON.parse(localStorage.getItem(keyFor(date))) || {}}
  catch(e){return {}}
}
function saveEntry(date, data){
  localStorage.setItem(keyFor(date), JSON.stringify(data));
}

function openExerciseGuide(name){
  const guide = exerciseGuides[name];
  if(!guide) return;
  const backdrop = document.getElementById("exerciseModalBackdrop");
  document.getElementById("exerciseModalTitle").textContent = guide.title;
  document.getElementById("exerciseModalContent").innerHTML = `
    ${guide.diagram}
    <strong>Quick form cues</strong>
    <ul class="cue-list">${guide.cues.map(c => `<li>${c}</li>`).join("")}</ul>
    <div class="runbox"><strong>Keep in mind:</strong> <span class="prescription">${guide.warning}</span></div>
  `;
  backdrop.classList.add("open");
  backdrop.setAttribute("aria-hidden","false");
  document.getElementById("closeExerciseModal").focus();
}

function closeExerciseGuide(){
  const backdrop = document.getElementById("exerciseModalBackdrop");
  backdrop.classList.remove("open");
  backdrop.setAttribute("aria-hidden","true");
}

function renderCalendar(){
  const cal = document.getElementById("calendar");
  cal.innerHTML="";
  const start = getWeekStart();
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const p=getPlanForDate(d);
    const entry=loadEntry(d);
    const el=document.createElement("div");
    el.className="day";
    if(state.selectedDate && isoDate(state.selectedDate)===isoDate(d)) el.classList.add("active");
    if(entry.complete) el.classList.add("done");
    el.innerHTML=`
      <div class="dow">${names[d.getDay()]} • ${d.getMonth()+1}/${d.getDate()}</div>
      <div class="focus">Week ${getRotationWeek(d)} • ${p.name}</div>
      <div class="run">${p.run}</div>
      ${entry.complete?'<div class="status">✓ Complete</div>':''}
    `;
    el.onclick=()=>{state.selectedDate=d; renderCalendar(); renderDay();};
    cal.appendChild(el);
  }
}

function renderDay(){
  if(!state.selectedDate){
    const today = new Date();
    const weekStart=getWeekStart(), weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+6);
    state.selectedDate = (today>=weekStart && today<=weekEnd)?today:new Date(weekStart);
  }
  const d=state.selectedDate, p=getPlanForDate(d), entry=loadEntry(d);
  document.getElementById("dayTitle").textContent=`Week ${getRotationWeek(d)} • ${p.name} — ${d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}`;
  document.getElementById("daySubtitle").textContent=`Primary focus: ${p.focus} • 4-week rotating program`;

  const list=document.getElementById("exerciseList");
  list.innerHTML="";
  p.exercises.forEach((ex,idx)=>{
    const saved=(entry.exercises||[])[idx]||{};
    const row=document.createElement("div");
    row.className="exercise";
    row.innerHTML=`
      <div>${exerciseGuides[ex[0]] ? `<button type="button" class="exercise-name-btn" data-guide="${ex[0]}">${ex[0]}</button>` : `<span class="exercise-name-static">${ex[0]}</span>`}<span class="prescription">${ex[1]}</span></div>
      <input data-field="weight" data-idx="${idx}" placeholder="lbs" value="${saved.weight||""}">
      <input data-field="reps" data-idx="${idx}" placeholder="reps" value="${saved.reps||""}">
      <input data-field="sets" data-idx="${idx}" placeholder="sets" value="${saved.sets||""}">
    `;
    list.appendChild(row);
  });

  const rb=document.getElementById("runBox");
  if(p.run==="No run" || d.getDay()===0){
    rb.innerHTML=`<strong>Conditioning</strong><div class="sub">${p.run}</div>`;
  }else{
    rb.innerHTML=`
      <strong>Run / Conditioning</strong>
      <div class="sub">${p.run}</div>
      <div class="run-grid">
        <input id="runDistance" placeholder="Distance / route" value="${entry.runDistance||""}">
        <input id="runTime" placeholder="Time" value="${entry.runTime||""}">
        <input id="runEffort" placeholder="Effort 1–10" value="${entry.runEffort||""}">
      </div>
    `;
  }
  document.getElementById("notes").value=entry.notes||"";
  document.getElementById("completeBtn").textContent=entry.complete?"Mark Incomplete":"Mark Complete";
  renderHistory();
}

function collectEntry(){
  const inputs=[...document.querySelectorAll("#exerciseList input")];
  const exercises=[];
  inputs.forEach(inp=>{
    const idx=Number(inp.dataset.idx);
    exercises[idx]=exercises[idx]||{};
    exercises[idx][inp.dataset.field]=inp.value;
  });
  const existing=loadEntry(state.selectedDate);
  return {
    ...existing,
    exercises,
    runDistance:document.getElementById("runDistance")?.value||"",
    runTime:document.getElementById("runTime")?.value||"",
    runEffort:document.getElementById("runEffort")?.value||"",
    notes:document.getElementById("notes").value,
    savedAt:new Date().toISOString()
  };
}

function renderHistory(){
  const target=document.getElementById("historyList");
  const dow=state.selectedDate.getDay();
  const rows=[];
  for(let i=0;i<140;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    if(d.getDay()!==dow) continue;
    const e=loadEntry(d);
    if(!e.savedAt && !e.complete) continue;
    const p=getPlanForDate(d);
    const bench=(e.exercises||[]).map((x,j)=>x && (x.weight||x.reps||x.sets) ? `${p.exercises[j][0]}: ${x.weight||"-"} lb / ${x.reps||"-"} reps / ${x.sets||"-"} sets` : null).filter(Boolean).slice(0,2).join(" • ");
    rows.push(`<div class="history-item"><strong>${d.toLocaleDateString()} • Week ${getRotationWeek(d)}</strong>${e.complete?" ✓":""}<br>${bench||"Workout saved"}${e.runTime?` • Run: ${e.runTime}`:""}</div>`);
    if(rows.length>=5) break;
  }
  target.innerHTML=rows.length?rows.join(""):'<div class="history-item">No previous entries yet.</div>';
}

document.getElementById("saveBtn").onclick=()=>{
  saveEntry(state.selectedDate, collectEntry());
  renderCalendar(); renderHistory();
};
document.getElementById("completeBtn").onclick=()=>{
  const e=collectEntry(); e.complete=!loadEntry(state.selectedDate).complete;
  saveEntry(state.selectedDate,e); renderCalendar(); renderDay();
};
document.getElementById("prevWeek").onclick=()=>{state.weekOffset--;state.selectedDate=null;renderCalendar();renderDay();}
document.getElementById("nextWeek").onclick=()=>{state.weekOffset++;state.selectedDate=null;renderCalendar();renderDay();}
document.getElementById("todayBtn").onclick=()=>{state.weekOffset=0;state.selectedDate=new Date();renderCalendar();renderDay();}
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Delete all saved workout data from this browser?")){
    Object.keys(localStorage).filter(k=>k.startsWith("workout_")).forEach(k=>localStorage.removeItem(k));
    renderCalendar();renderDay();
  }
};
document.getElementById("exportBtn").onclick=()=>{
  const data={};
  Object.keys(localStorage).filter(k=>k.startsWith("workout_")).sort().forEach(k=>data[k.replace("workout_","")]=JSON.parse(localStorage.getItem(k)));
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="home-workout-history.json";
  a.click();
  URL.revokeObjectURL(a.href);
};


document.getElementById("exerciseList").addEventListener("click",(e)=>{
  const btn=e.target.closest("[data-guide]");
  if(btn) openExerciseGuide(btn.dataset.guide);
});
document.getElementById("closeExerciseModal").addEventListener("click",closeExerciseGuide);
document.getElementById("exerciseModalBackdrop").addEventListener("click",(e)=>{
  if(e.target.id==="exerciseModalBackdrop") closeExerciseGuide();
});
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape") closeExerciseGuide();
});

renderCalendar();
renderDay();
</script>

      <h3 id="exerciseModalTitle">Exercise guide</h3>
      <button id="closeExerciseModal" class="close-modal" type="button" aria-label="Close exercise guide">×</button>
    </div>

  </div>
